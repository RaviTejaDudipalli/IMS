# ======================================================
# Application
# ======================================================
spring.application.name=inventory-management-system
server.port=8080
server.servlet.context-path=/api

# ======================================================
# Profile (default = dev with H2; switch to mysql for prod)
# ======================================================
spring.profiles.active=dev

# ======================================================
# JPA / Hibernate (common)
# ======================================================
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ======================================================
# Jackson
# ======================================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ======================================================
# Validation / Error responses
# ======================================================
server.error.include-message=always
server.error.include-binding-errors=always

# ======================================================
# JWT
# ======================================================
# 256-bit (32-byte) secret. Replace in production via env var IMS_JWT_SECRET.
ims.security.jwt.secret=${IMS_JWT_SECRET:c2VjcmV0LWtleS1mb3ItaW1zLWp3dC10b2tlbi1zaWduaW5nLTEyMzQ1Ng==}
ims.security.jwt.expiration-ms=${IMS_JWT_EXPIRATION_MS:3600000}
ims.security.jwt.issuer=ims-backend

# ======================================================
# Inventory rules
# ======================================================
ims.inventory.default-low-stock-threshold=10

# ======================================================
# Springdoc / Swagger
# ======================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ======================================================
# Actuator
# ======================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# ======================================================
# Logging
# ======================================================
logging.level.root=INFO
logging.level.com.ims=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
logging.file.name=logs/ims.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
